<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Ink | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#080d18;
  --panel:#111a2b;
  --border:#26344a;
  --text:#f4f7fc;
  --muted:#9ba9bf;
  --blue:#4b83ff;
  --green:#37c98b;
  --red:#ff6678;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header {
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.logo { font-size:23px; font-weight:800; letter-spacing:2px; }
.logo span { color:var(--blue); }
button,input {
  font:inherit;
  border-radius:9px;
}
button {
  border:0;
  padding:12px 16px;
  cursor:pointer;
  font-weight:700;
}
button:disabled { opacity:.55; cursor:not-allowed; }
.primary { background:var(--blue); color:white; }
.secondary { background:#253149; color:white; }
.approve { background:#124c3a; color:#78f0bd; }
.reject { background:#522432; color:#ff9eab; }
main {
  width:min(900px,100%);
  margin:0 auto;
  padding:24px 16px 50px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
}
h1 { font-size:25px; margin:0 0 8px; }
h2 { font-size:19px; margin:0 0 16px; }
p { color:var(--muted); line-height:1.6; }
label { display:block; margin:16px 0 7px; font-size:14px; }
input {
  width:100%;
  padding:14px;
  color:white;
  background:#080f1d;
  border:1px solid var(--border);
  outline:none;
}
input:focus { border-color:var(--blue); }
form .primary { width:100%; margin-top:20px; }
#message {
  margin-top:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.error { color:#ff9eab; }
.success { color:#78f0bd; }
.muted { color:var(--muted); }
.submission {
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-top:14px;
  overflow-wrap:anywhere;
}
.row {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:15px;
}
.row button { flex:1; min-width:110px; }
.badge {
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#253149;
  margin-bottom:12px;
}
.hidden { display:none !important; }
.top-actions { display:flex; gap:8px; }
@media(max-width:480px) {
  header { padding:16px; }
  .logo { font-size:19px; }
  .card { padding:17px; }
}
</style>
</head>
<body><header>
  <div class="logo">ELITE <span>INK</span></div>
  <div class="top-actions">
    <button id="refreshBtn" class="secondary hidden" type="button">Refresh</button>
    <button id="logoutBtn" class="secondary hidden" type="button">Logout</button>
  </div>
</header><main>
  <section id="loginSection" class="card">
    <h1>Admin Login</h1>
    <p>Sign in to review customer verification submissions.</p><form id="loginForm">
  <label for="email">Admin email</label>
  <input id="email" type="email" autocomplete="username"
    placeholder="Enter your admin email" required>

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password"
    placeholder="Enter your password" required>

  <button id="loginBtn" class="primary" type="submit">Sign In</button>
  <div id="message" role="status" aria-live="polite"></div>
</form>

  </section>  <section id="dashboard" class="hidden">
    <div class="card">
      <h1>Admin Dashboard</h1>
      <p>Review submissions and approve or reject each one.</p>
      <p id="signedInAs" class="muted"></p>
      <div id="dashboardMessage" role="status" aria-live="polite"></div>
    </div><div class="card">
  <h2>Customer Submissions</h2>
  <div id="submissions">
    <p>Loading submissions...</p>
  </div>
</div>

  </section>
</main><script>
(() => {
  const SUPABASE_URL = "https://nywvzauhxzegbwwipdqi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Wech5BynoPAXAl90h0XjXw_dudU5jpC";

  const $ = (id) => document.getElementById(id);
  const loginSection = $("loginSection");
  const dashboard = $("dashboard");
  const loginForm = $("loginForm");
  const loginBtn = $("loginBtn");
  const message = $("message");
  const dashboardMessage = $("dashboardMessage");
  const submissions = $("submissions");

  function showMessage(element, text, type = "") {
    element.textContent = text;
    element.className = type;
  }

  function setLoggedIn(user) {
    loginSection.classList.add("hidden");
    dashboard.classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("refreshBtn").classList.remove("hidden");
    $("signedInAs").textContent = "Signed in as: " + user.email;
  }

  function setLoggedOut() {
    loginSection.classList.remove("hidden");
    dashboard.classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
    $("refreshBtn").classList.add("hidden");
    loginForm.reset();
    showMessage(message, "");
  }

  if (!window.supabase || !window.supabase.createClient) {
    showMessage(message,
      "Supabase library did not load. Check your internet connection and reopen this page.",
      "error");
    loginBtn.disabled = true;
    return;
  }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadSubmissions() {
    submissions.replaceChildren();
    const loading = document.createElement("p");
    loading.textContent = "Loading submissions...";
    submissions.appendChild(loading);
    showMessage(dashboardMessage, "");

    try {
      const { data, error } = await db
        .from("elite_ink_verifications")
        .select("id,x_num,xx_num,xxx_num,status,created_at")
        .order("created_at", { ascending: false });

      if (error) throw error;

      submissions.replaceChildren();

      if (!data || data.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "No submissions found yet.";
        submissions.appendChild(empty);
        return;
      }

      data.forEach((item) => {
        const card = document.createElement("article");
        card.className = "submission";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Status: " + item.status;
        card.appendChild(badge);

        const values = document.createElement("div");
        values.style.lineHeight = "1.9";

        const lines = [
          ["x.num", item.x_num],
          ["xx.num", item.xx_num],
          ["xxx.num", item.xxx_num],
          ["Submitted", item.created_at
            ? new Date(item.created_at).toLocaleString()
            : "Unknown"]
        ];

        lines.forEach(([label, value]) => {
          const line = document.createElement("div");
          const strong = document.createElement("strong");
          strong.textContent = label + ": ";
          line.appendChild(strong);
          line.appendChild(document.createTextNode(String(value ?? "")));
          values.appendChild(line);
        });

        card.appendChild(values);

        if (item.status === "pending") {
          const row = document.createElement("div");
          row.className = "row";

          const approveBtn = document.createElement("button");
          approveBtn.type = "button";
          approveBtn.className = "approve";
          approveBtn.textContent = "Approve";

          const rejectBtn = document.createElement("button");
          rejectBtn.type = "button";
          rejectBtn.className = "reject";
          rejectBtn.textContent = "Reject";

          approveBtn.addEventListener("click", () =>
            updateStatus(item.id, "approved", approveBtn, rejectBtn));
          rejectBtn.addEventListener("click", () =>
            updateStatus(item.id, "rejected", approveBtn, rejectBtn));

          row.append(approveBtn, rejectBtn);
          card.appendChild(row);
        }

        submissions.appendChild(card);
      });

      showMessage(dashboardMessage, "Submissions loaded.", "success");
    } catch (error) {
      submissions.replaceChildren();
      const errorText = document.createElement("p");
      errorText.className = "error";
      errorText.textContent = error.message || "Could not load submissions.";
      submissions.appendChild(errorText);
      showMessage(dashboardMessage,
        "Check your admin permissions and database policies.", "error");
    }
  }

  async function updateStatus(id, status, approveBtn, rejectBtn) {
    approveBtn.disabled = true;
    rejectBtn.disabled = true;
    showMessage(dashboardMessage, "Updating submission...");

    try {
      const { data, error } = await db
        .from("elite_ink_verifications")
        .update({ status })
        .eq("id", id)
        .eq("status", "pending")
        .select("id");

      if (error) throw error;
      if (!data || data.length === 0) {
        throw new Error("No row updated. Check admin permissions or refresh the list.");
      }

      showMessage(dashboardMessage,
        "Submission " + status + " successfully.", "success");
      await loadSubmissions();
    } catch (error) {
      showMessage(dashboardMessage, error.message || "Update failed.", "error");
      approveBtn.disabled = false;
      rejectBtn.disabled = false;
    }
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";
    showMessage(message, "Connecting to Supabase...");

    const email = $("email").value.trim();
    const password = $("password").value;

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;
      if (!data.user) throw new Error("Login did not return a user account.");

      setLoggedIn(data.user);
      await loadSubmissions();
    } catch (error) {
      showMessage(message,
        error.message || "Login failed. Check your email and password.",
        "error");
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";
    }
  });

  $("refreshBtn").addEventListener("click", loadSubmissions);

  $("logoutBtn").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      showMessage(dashboardMessage, error.message, "error");
      return;
    }
    setLoggedOut();
  });

  async function restoreSession() {
    const { data, error } = await db.auth.getSession();
    if (error) {
      showMessage(message, error.message, "error");
      return;
    }
    if (data.session && data.session.user) {
      setLoggedIn(data.session.user);
      await loadSubmissions();
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT" || !session) {
      setLoggedOut();
    }
  });

  restoreSession();
})();
</script></body>
</html>
